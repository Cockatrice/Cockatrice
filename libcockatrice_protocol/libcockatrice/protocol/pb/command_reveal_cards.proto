syntax = "proto2";
import "game_commands.proto";
message Command_RevealCards {
    extend GameCommand {
        optional Command_RevealCards ext = 1026;
    }
    optional string zone_name = 1;
    repeated sint32 card_id = 2 [packed = false];
    optional sint32 player_id = 3 [default = -1];
    optional bool grant_write_access = 4;
    optional sint32 top_cards = 5 [default = -1];
}

// Separate extension so older servers reject the operation without revealing any cards.
message Command_RevealRandomCards {
    extend GameCommand {
        optional Command_RevealRandomCards ext = 1036;
    }
    optional string zone_name = 1;
    optional sint32 number_of_cards = 2;
    optional sint32 player_id = 3 [default = -1];
}
