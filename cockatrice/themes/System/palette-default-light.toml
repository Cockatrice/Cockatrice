# The System theme derives all of its colors from the platform palette
# (e.g. qt6ct's custom color scheme on Linux), so it must NOT ship palette
# overrides. Only the identity and semantic app colors are provided here, so
# buttons keep their classic greens while the actual palette stays native to
# the OS.
# Icon, IconStrong and IconSoft are deliberately absent: a theme with no
# palette of its own derives its icon ink from the platform palette.
[AppColors]
AccentStrong         = #ff148c3c
AccentSoft           = #ff78c850
Positive             = #ff1a7d3a
PositiveStrong       = #ff007e28
PositiveSoft         = #ff4c7659
Negative             = #ffb3261e
NegativeStrong       = #ffda0b00
NegativeSoft         = #ff935f5c