# The System theme derives all of its colors from the platform palette
# (e.g. qt6ct's custom color scheme on Linux), so it must NOT ship palette
# overrides. Only the identity and semantic app colors are provided here, so
# buttons keep their classic greens while the actual palette stays native to
# the OS.
# The neutral icon family is deliberately not authored: the palette file is
# picked from the theme's scheme, which on Qt < 6.5 is always light and on newer
# Qt can be unknown, so a fixed black-or-white ladder would be invisible on a
# platform palette of the other scheme. Neutral ink derives from the live
# WindowText instead.
[AppColors]
AccentStrong         = #ff148c3c
AccentSoft           = #ff78c850
Positive             = #ff6dd58c
PositiveStrong       = #ff32c05c
PositiveSoft         = #ff8ab196
Negative             = #ffff8a80
NegativeStrong       = #ffff8378
NegativeSoft         = #ffc79e9b
