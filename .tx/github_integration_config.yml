# Integration Docs: https://help.transifex.com/en/articles/6265125-github-installation-and-configuration#h_de29ef5cec
# Config Parameter: https://help.transifex.com/en/articles/6265125-github-installation-and-configuration#h_a734c3e219
# Supported Files: https://help.transifex.com/en/collections/3519116-file-formats

filters:
  - filter_type: file
    file_format: QT
    source_language: en
    source_file: cockatrice/cockatrice_en@source.ts
    translation_files_expression: cockatrice/translations/cockatrice_<lang>.ts

  - filter_type: file
    file_format: QT
    source_language: en
    source_file: oracle/oracle_en@source.ts
    translation_files_expression: oracle/translations/oracle_<lang>.ts
